---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-windows-installer
  annotations:
    tekton.dev/pipelines.minVersion: "0.1.0"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to sign a Windows NSIS installer.
    
    This task:
    - SSHs to the Windows signing VM
    - Runs signtool to sign the installer
    - Verifies the signature
    - Returns Windows path to signed installer (for push-to-cdn to SCP)
    
    Part of the Windows signing pipeline: sign-windows-binaries -> create-windows-installer -> sign-windows-installer
  params:
    - name: created_installers
      type: string
      description: JSON array of created installers [{component, arch, win_path, installer_name}] from create-windows-installer
    - name: windowsCredentials
      type: string
      description: Secret containing Windows host credentials
      default: windows-credentials
    - name: windowsSSHKey
      type: string
      description: Secret containing SSH private key for Windows host
      default: windows-ssh-key
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success if the task succeeds, the error otherwise
    - name: signed_installers
      description: JSON array of signed installers [{component, arch, win_path, installer_name}]
  volumes:
    - name: workdir
      emptyDir: {}
    - name: windows-credentials
      secret:
        secretName: $(params.windowsCredentials)
        defaultMode: 0444
    - name: windows-ssh-key
      secret:
        secretName: $(params.windowsSSHKey)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true

  steps:
    - name: sign-installer
      image: quay.io/konflux-ci/release-service-utils:82012e03002128f2a226acb23dc5c6fc1c37f5b6
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      volumeMounts:
        - name: workdir
          mountPath: /workdir
        - name: windows-credentials
          mountPath: /mnt/windows-credentials
        - name: windows-ssh-key
          mountPath: /mnt/windows-ssh-key
      env:
        - name: CREATED_INSTALLERS
          value: "$(params.created_installers)"
      script: |
        #!/usr/bin/env bash
        set -e
        set -o pipefail

        # Load secrets
        WIN_HOST=$(cat /mnt/windows-credentials/host)
        WIN_USER=$(cat /mnt/windows-credentials/username)
        WIN_CERT_THUMBPRINT=$(cat /mnt/windows-credentials/cert_thumbprint)

        set -x

        STDERR_FILE=/tmp/stderr.txt

        exitfunc() {
            local err=$1
            local line=$2
            local command="$3"
            if [ "$err" -eq 0 ] ; then
                echo -n "Success" > "$(results.result.path)"
            else
                echo "$0: ERROR '$command' failed at line $line - exited with status $err" \
                  > "$(results.result.path)"
                if [ -f "$STDERR_FILE" ] ; then
                    grep -v "^\+" "$STDERR_FILE" | tail -c 512 | tee -a "$(results.result.path)"
                fi
            fi
            exit $err
        }
        trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

        # Setup SSH
        mkdir -p /tekton/home/.ssh
        cp /mnt/windows-ssh-key/windows_id_rsa /tekton/home/.ssh/id_rsa
        chmod 600 /tekton/home/.ssh/id_rsa
        
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        SSH_CMD="ssh $SSH_OPTS ${WIN_USER}@${WIN_HOST}"

        # Parse input array
        INSTALLER_COUNT=$(jq 'length' <<< "$CREATED_INSTALLERS")
        echo "=== Signing $INSTALLER_COUNT installers ==="

        # Initialize output array
        SIGNED_INSTALLERS="[]"

        # Loop over each installer
        for i in $(seq 0 $((INSTALLER_COUNT - 1))); do
            INSTALLER=$(jq -c ".[$i]" <<< "$CREATED_INSTALLERS")
            WIN_PATH=$(jq -r '.win_path' <<< "$INSTALLER")
            INSTALLER_NAME=$(jq -r '.installer_name' <<< "$INSTALLER")
            WIN_ARCH=$(jq -r '.arch' <<< "$INSTALLER")
            COMPONENT_NAME=$(jq -r '.component' <<< "$INSTALLER")

            INSTALLER_PATH="${WIN_PATH}\\dist\\${INSTALLER_NAME}"

            echo ""
            echo "=== [$((i+1))/$INSTALLER_COUNT] Signing installer for $COMPONENT_NAME ($WIN_ARCH) ==="
            echo "Installer path: $INSTALLER_PATH"

            # Sign the installer using signtool
            set +x
            $SSH_CMD "
                \$env:CERT_THUMBPRINT = '$WIN_CERT_THUMBPRINT'
                
                # Path to signtool (Windows SDK)
                \$signtool = 'C:\\Program Files (x86)\\Windows Kits\\10\\bin\\10.0.26100.0\\x64\\signtool.exe'
                
                # Verify installer exists
                if (-not (Test-Path '$INSTALLER_PATH')) {
                    Write-Error 'Installer not found at: $INSTALLER_PATH'
                    exit 1
                }
                
                Write-Host 'Signing installer: $INSTALLER_PATH'
                Write-Host 'Using certificate thumbprint: $WIN_CERT_THUMBPRINT'
                
                # Sign the installer
                & \$signtool sign /v /sha1 \$env:CERT_THUMBPRINT /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 '$INSTALLER_PATH'
                
                if (\$LASTEXITCODE -ne 0) {
                    Write-Error 'signtool sign failed'
                    exit 1
                }
                
                Write-Host ''
                Write-Host 'Verifying signature...'
                
                # Verify the signature
                & \$signtool verify /v /pa '$INSTALLER_PATH'
                
                if (\$LASTEXITCODE -ne 0) {
                    Write-Error 'signtool verify failed'
                    exit 1
                }
                
                Write-Host ''
                Write-Host 'Installer signed successfully!'
                Get-Item '$INSTALLER_PATH' | Format-Table Name, Length, LastWriteTime
            " 2>&1 | tee /tmp/sign_output.txt
            set -x

            # Check for errors
            if grep -qi "error\|failed" /tmp/sign_output.txt | grep -vi "0 errors"; then
                echo "WARNING: Possible signing errors detected"
            fi

            echo "Signed installer at: $INSTALLER_PATH"

            # Add to output array - store Windows path for push-to-cdn to SCP
            SIGNED_INSTALLERS=$(jq -c \
                --arg component "$COMPONENT_NAME" \
                --arg arch "$WIN_ARCH" \
                --arg win_path "$WIN_PATH" \
                --arg installer_name "$INSTALLER_NAME" \
                '. + [{component: $component, arch: $arch, win_path: $win_path, installer_name: $installer_name}]' \
                <<< "$SIGNED_INSTALLERS")
        done

        echo ""
        echo "=== Sign-windows-installer complete ==="
        echo "Signed $INSTALLER_COUNT installers:"
        jq '.' <<< "$SIGNED_INSTALLERS"

        # Write results
        echo -n "$SIGNED_INSTALLERS" > "$(results.signed_installers.path)"
