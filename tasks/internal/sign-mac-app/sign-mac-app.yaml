---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-mac-app
  annotations:
    tekton.dev/pipelines.minVersion: "0.1.0"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to sign macOS .app bundles on a remote Mac VM.
    
    This task:
    - SSHs to the Mac signing VM
    - Calls mac_signer.py script with pullspec
    - Script handles: oras pull, extract, sign, oras push
    - Returns signed artifact pullspec
    
    Part of the mac signing pipeline: sign-mac-app -> create-mac-dmg -> sign-mac-dmg
  params:
    - name: mac_artifacts
      type: string
      description: JSON array of macOS artifacts [{arch, pullspec, component}]
    - name: pipelineRunUid
      type: string
      description: Unique identifier for this pipeline run (used in push tag)
    - name: outputRegistry
      type: string
      description: Registry to push signed artifacts to
      default: quay.io/konflux-artifacts
    - name: quaySecret
      type: string
      description: Secret containing Quay credentials for oras pull/push
      default: quay-credentials
    - name: macHostCredentials
      type: string
      description: Secret containing Mac host username and host
      default: mac-host-credentials
    - name: macSigningCredentials
      type: string
      description: Secret containing Mac signing credentials (keychain password, CSC_NAME)
      default: mac-signing-credentials
    - name: macSSHKey
      type: string
      description: Secret containing SSH private key for Mac host
      default: mac-ssh-key
    - name: signerScriptPath
      type: string
      description: Path to mac_signer.py on the Mac VM
      default: "/Users/konflux-release-signing-sa/mac_signer/mac_signer.py"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success if the task succeeds, the error otherwise
    - name: signed_apps
      description: JSON array of signed apps [{component, arch, pullspec}]
  volumes:
    - name: workdir
      emptyDir: {}
    - name: quay-secret
      secret:
        secretName: $(params.quaySecret)
        defaultMode: 0444
    - name: mac-host-credentials
      secret:
        secretName: $(params.macHostCredentials)
        defaultMode: 0444
    - name: mac-signing-credentials
      secret:
        secretName: $(params.macSigningCredentials)
        defaultMode: 0444
    - name: mac-ssh-key
      secret:
        secretName: $(params.macSSHKey)
        defaultMode: 0444
    - name: redhat-workloads-token
      secret:
        secretName: redhat-workloads-token
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true

  steps:
    - name: sign-app
      image: quay.io/konflux-ci/release-service-utils:82012e03002128f2a226acb23dc5c6fc1c37f5b6
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      volumeMounts:
        - name: workdir
          mountPath: /workdir
        - name: quay-secret
          mountPath: /mnt/quay-secret
        - name: mac-host-credentials
          mountPath: /mnt/mac-host-credentials
        - name: mac-signing-credentials
          mountPath: /mnt/mac-signing-credentials
        - name: mac-ssh-key
          mountPath: /mnt/mac-ssh-key
        - name: redhat-workloads-token
          mountPath: /mnt/redhat-workloads-token
      env:
        - name: MAC_ARTIFACTS
          value: "$(params.mac_artifacts)"
        - name: OUTPUT_REGISTRY
          value: "$(params.outputRegistry)"
        - name: SIGNER_SCRIPT
          value: "$(params.signerScriptPath)"
        - name: PIPELINE_RUN_UID
          value: "$(params.pipelineRunUid)"
      script: |
        #!/usr/bin/env bash
        set -e
        set -o pipefail

        # Load secrets
        MAC_HOST=$(cat /mnt/mac-host-credentials/host)
        MAC_USER=$(cat /mnt/mac-host-credentials/username)
        CSC_NAME=$(cat /mnt/mac-signing-credentials/csc_name)
        CSC_KEY_PASSWORD=$(cat /mnt/mac-signing-credentials/keychain_password)

        set -x

        STDERR_FILE=/tmp/stderr.txt
        OUTPUT_FILE=/tmp/signer_output.txt

        # Validate we have artifacts
        ARTIFACT_COUNT=$(jq 'length' <<< "$MAC_ARTIFACTS")
        if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "ERROR: No macOS artifacts found in mac_artifacts array"
            exit 1
        fi
        
        echo "Found $ARTIFACT_COUNT macOS artifact(s) to sign"

        exitfunc() {
            local err=$1
            local line=$2
            local command="$3"
            if [ "$err" -eq 0 ] ; then
                echo -n "Success" > "$(results.result.path)"
            else
                echo "$0: ERROR '$command' failed at line $line - exited with status $err" \
                  > "$(results.result.path)"
                if [ -f "$OUTPUT_FILE" ] ; then
                    grep -v "^\+" "$OUTPUT_FILE" | tail -c 512 | tee -a "$(results.result.path)"
                fi
            fi
            exit $err
        }
        trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

        # Setup SSH
        mkdir -p ~/.ssh
        cp /mnt/mac-ssh-key/mac_id_rsa ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # SSH options
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        SSH_CMD="ssh $SSH_OPTS ${MAC_USER}@${MAC_HOST}"
        SCP_CMD="scp $SSH_OPTS"

        # Copy pull credentials (dockerconfigjson) to Mac VM for pulling from redhat-user-workloads
        # Strip surrounding quotes if present (some secrets wrap JSON in quotes)
        # Disable trace to avoid logging credentials
        PULL_CONFIG_PATH="/tmp/pull-docker-config.json"
        PUSH_CONFIG_PATH="/tmp/push-docker-config.json"
        set +x
        PULL_CONFIG_CONTENT=$(cat /mnt/redhat-workloads-token/.dockerconfigjson | sed "s/^'//;s/'$//")
        PUSH_CONFIG_CONTENT=$(cat /mnt/quay-secret/dockerconfigjson | sed "s/^'//;s/'$//")
        $SSH_CMD "rm -f $PULL_CONFIG_PATH && echo '$PULL_CONFIG_CONTENT' > $PULL_CONFIG_PATH"
        $SSH_CMD "rm -f $PUSH_CONFIG_PATH && echo '$PUSH_CONFIG_CONTENT' > $PUSH_CONFIG_PATH"
        set -x
        echo "Pull credentials copied to Mac VM: $PULL_CONFIG_PATH"
        echo "Push credentials copied to Mac VM: $PUSH_CONFIG_PATH"

        # Verify remote signer script exists
        echo "Verifying remote signer script exists at: $SIGNER_SCRIPT"
        if ! $SSH_CMD "test -f '$SIGNER_SCRIPT'" 2>"$STDERR_FILE"; then
            echo "ERROR: Remote signer script not found at $SIGNER_SCRIPT on $MAC_HOST"
            exit 1
        fi
        echo "Remote signer script found"

        # Initialize output array
        SIGNED_APPS="[]"

        # Loop over all artifacts
        for i in $(seq 0 $((ARTIFACT_COUNT - 1))); do
            ARTIFACT=$(jq -c ".[$i]" <<< "$MAC_ARTIFACTS")
            MAC_PULLSPEC=$(jq -r '.pullspec' <<< "$ARTIFACT")
            MAC_ARCH=$(jq -r '.arch' <<< "$ARTIFACT")
            COMPONENT_NAME=$(jq -r '.component' <<< "$ARTIFACT")

            echo ""
            echo "=== Signing artifact $((i + 1))/$ARTIFACT_COUNT ==="
            echo "Component: $COMPONENT_NAME"
            echo "Arch: $MAC_ARCH"
            echo "Pullspec: $MAC_PULLSPEC"

            # Disable tracing to prevent secrets from appearing in logs
            set +x
            $SSH_CMD "
                export CSC_NAME='$CSC_NAME'
                export CSC_KEY_PASSWORD='$CSC_KEY_PASSWORD'
                
                python3 $SIGNER_SCRIPT sign-app \
                    --pullspec '$MAC_PULLSPEC' \
                    --output-registry '$OUTPUT_REGISTRY' \
                    --component '$COMPONENT_NAME' \
                    --arch '$MAC_ARCH' \
                    --pipeline-uid '$PIPELINE_RUN_UID' \
                    --pull-config '$PULL_CONFIG_PATH' \
                    --push-config '$PUSH_CONFIG_PATH'
            " 2>&1 | tee "$OUTPUT_FILE"
            set -x

            # Log the command (without secrets)
            echo "python3 $SIGNER_SCRIPT sign-app \\
                --pullspec '$MAC_PULLSPEC' \\
                --output-registry '$OUTPUT_REGISTRY' \\
                --component '$COMPONENT_NAME' \\
                --arch '$MAC_ARCH' \\
                --pipeline-uid '$PIPELINE_RUN_UID' \\
                --pull-config '$PULL_CONFIG_PATH' \\
                --push-config '$PUSH_CONFIG_PATH'"

            # Parse output - script outputs APP_PATH= and PULLSPEC= lines
            # Expected format from mac_signer.py:
            #   APP_PATH=/path/to/signed/App.app
            #   PULLSPEC=quay.io/registry/image:tag
            SIGNED_APP_PATH=$(grep "^APP_PATH=" "$OUTPUT_FILE" | cut -d= -f2- | tr -d '\r\n')
            SIGNED_PULLSPEC=$(grep "^PULLSPEC=" "$OUTPUT_FILE" | cut -d= -f2- | tr -d '\r\n')

            # Fallback: if no APP_PATH= line, try last line for pullspec (backwards compat)
            if [ -z "$SIGNED_PULLSPEC" ]; then
                SIGNED_PULLSPEC=$(tail -1 "$OUTPUT_FILE" | tr -d '\r\n')
            fi

            echo "Signed pullspec: $SIGNED_PULLSPEC"

            # Validate we got pullspec from signer
            if [ -z "$SIGNED_PULLSPEC" ]; then
                echo "ERROR: Signer script returned empty pullspec for $COMPONENT_NAME ($MAC_ARCH)"
                echo "Check that $SIGNER_SCRIPT is working correctly on the Mac VM"
                exit 1
            fi

            # Add to output array
            SIGNED_APPS=$(jq --arg component "$COMPONENT_NAME" \
                             --arg arch "$MAC_ARCH" \
                             --arg pullspec "$SIGNED_PULLSPEC" \
                             '. + [{component: $component, arch: $arch, pullspec: $pullspec}]' \
                             <<< "$SIGNED_APPS")
        done

        echo ""
        echo "=== Sign-mac-app complete ==="
        echo "Signed $ARTIFACT_COUNT artifact(s):"
        jq '.' <<< "$SIGNED_APPS"

        # Write results
        echo -n "$SIGNED_APPS" > "$(results.signed_apps.path)"
