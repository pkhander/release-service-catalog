---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sign-mac-dmg
  annotations:
    tekton.dev/pipelines.minVersion: "0.1.0"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to sign, notarize, and staple a macOS DMG installer.
    
    This task:
    - SSHs to the Mac signing VM
    - Calls mac_signer.py sign-dmg (sign + notarize + staple in place)
    - Returns Mac VM path for downstream tasks to SCP
    
    Part of the mac signing pipeline: sign-mac-app -> create-mac-dmg -> sign-mac-dmg
  params:
    - name: created_dmgs
      type: string
      description: JSON array of created DMGs [{component, arch, dmg_path, dmg_name}] from create-mac-dmg
    - name: macHostCredentials
      type: string
      description: Secret containing Mac host username and host
      default: mac-host-credentials
    - name: macSigningCredentials
      type: string
      description: Secret containing Mac signing credentials (keychain, Apple ID, etc.)
      default: mac-signing-credentials
    - name: macSSHKey
      type: string
      description: Secret containing SSH private key for Mac host
      default: mac-ssh-key
    - name: signerScriptPath
      type: string
      description: Path to mac_signer.py on the Mac VM
      default: "/Users/konflux-release-signing-sa/mac_signer/mac_signer.py"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success if the task succeeds, the error otherwise
    - name: signed_dmgs
      description: JSON array of signed DMGs [{component, arch, mac_path, dmg_name}] - paths on Mac VM
  volumes:
    - name: mac-host-credentials
      secret:
        secretName: $(params.macHostCredentials)
        defaultMode: 0444
    - name: mac-signing-credentials
      secret:
        secretName: $(params.macSigningCredentials)
        defaultMode: 0444
    - name: mac-ssh-key
      secret:
        secretName: $(params.macSSHKey)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true

  steps:
    - name: sign-notarize-dmg
      image: quay.io/konflux-ci/release-service-utils:82012e03002128f2a226acb23dc5c6fc1c37f5b6
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      volumeMounts:
        - name: mac-host-credentials
          mountPath: /mnt/mac-host-credentials
        - name: mac-signing-credentials
          mountPath: /mnt/mac-signing-credentials
        - name: mac-ssh-key
          mountPath: /mnt/mac-ssh-key
      env:
        - name: CREATED_DMGS
          value: "$(params.created_dmgs)"
        - name: SIGNER_SCRIPT
          value: "$(params.signerScriptPath)"
      script: |
        #!/usr/bin/env bash
        set -e
        set -o pipefail

        # Load secrets
        MAC_HOST=$(cat /mnt/mac-host-credentials/host)
        MAC_USER=$(cat /mnt/mac-host-credentials/username)
        CSC_NAME=$(cat /mnt/mac-signing-credentials/csc_name)
        CSC_KEY_PASSWORD=$(cat /mnt/mac-signing-credentials/keychain_password)
        APPLE_ID=$(cat /mnt/mac-signing-credentials/apple_id)
        APPLE_APP_SPECIFIC_PASSWORD=$(cat /mnt/mac-signing-credentials/app_specific_password)
        APPLE_TEAM_ID=$(cat /mnt/mac-signing-credentials/apple_team_id)

        set -x

        STDERR_FILE=/tmp/stderr.txt
        OUTPUT_FILE=/tmp/signer_output.txt

        exitfunc() {
            local err=$1
            local line=$2
            local command="$3"
            if [ "$err" -eq 0 ] ; then
                echo -n "Success" > "$(results.result.path)"
            else
                echo "$0: ERROR '$command' failed at line $line - exited with status $err" \
                  > "$(results.result.path)"
                if [ -f "$OUTPUT_FILE" ] ; then
                    grep -v "^\+" "$OUTPUT_FILE" | tail -c 512 | tee -a "$(results.result.path)"
                fi
            fi
            exit $err
        }
        trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

        # Setup SSH
        mkdir -p ~/.ssh
        cp /mnt/mac-ssh-key/mac_id_rsa ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        SSH_CMD="ssh $SSH_OPTS ${MAC_USER}@${MAC_HOST}"

        # Parse input array
        DMG_COUNT=$(jq 'length' <<< "$CREATED_DMGS")
        echo "=== Signing $DMG_COUNT DMGs ==="

        # Initialize output array
        SIGNED_DMGS="[]"

        # Loop over each DMG
        for i in $(seq 0 $((DMG_COUNT - 1))); do
            DMG=$(jq -c ".[$i]" <<< "$CREATED_DMGS")
            DMG_PATH=$(jq -r '.dmg_path' <<< "$DMG")
            DMG_NAME=$(jq -r '.dmg_name' <<< "$DMG")
            DMG_ARCH=$(jq -r '.arch' <<< "$DMG")
            COMPONENT_NAME=$(jq -r '.component' <<< "$DMG")

            echo ""
            echo "=== [$((i+1))/$DMG_COUNT] Signing DMG for $COMPONENT_NAME ($DMG_ARCH) ==="
            echo "DMG path (on Mac): $DMG_PATH"

            # Call the signer script on the Mac VM
            # Script handles: sign, notarize, staple (in place)
            $SSH_CMD "
                export CSC_NAME='$CSC_NAME'
                export CSC_KEY_PASSWORD='$CSC_KEY_PASSWORD'
                export APPLE_ID='$APPLE_ID'
                export APPLE_APP_SPECIFIC_PASSWORD='$APPLE_APP_SPECIFIC_PASSWORD'
                export APPLE_TEAM_ID='$APPLE_TEAM_ID'
                
                python3 $SIGNER_SCRIPT sign-dmg --dmg-path '$DMG_PATH'
            " 2>&1 | tee "$OUTPUT_FILE"

            # Check exit status (grep for error indicators)
            if grep -q "ERROR\|MacSignerError\|failed" "$OUTPUT_FILE"; then
                echo "ERROR: sign-dmg failed for $DMG_NAME"
                exit 1
            fi

            echo "✓ DMG signed and left on Mac at: $DMG_PATH"

            # Add to output array - return Mac path for downstream tasks to SCP
            SIGNED_DMGS=$(jq -c \
                --arg component "$COMPONENT_NAME" \
                --arg arch "$DMG_ARCH" \
                --arg mac_path "$DMG_PATH" \
                --arg dmg_name "$DMG_NAME" \
                '. + [{component: $component, arch: $arch, mac_path: $mac_path, dmg_name: $dmg_name}]' \
                <<< "$SIGNED_DMGS")
        done

        echo ""
        echo "=== Sign-mac-dmg complete ==="
        echo "Signed $DMG_COUNT DMGs:"
        jq . <<< "$SIGNED_DMGS"

        # Write results
        echo -n "$SIGNED_DMGS" > "$(results.signed_dmgs.path)"
