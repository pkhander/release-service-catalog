---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: create-windows-installer
  annotations:
    tekton.dev/pipelines.minVersion: "0.1.0"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to create Windows NSIS installer from signed binaries.
    
    This task:
    - SSHs to the Windows VM (files already there from sign-windows-binaries)
    - Uses electron-builder to create NSIS installer from signed win-unpacked
    - Leaves unsigned installer on disk for sign-windows-installer task
    
    Part of the Windows signing pipeline: sign-windows-binaries -> create-windows-installer -> sign-windows-installer
  params:
    - name: signed_binaries
      type: string
      description: JSON array of signed binaries [{component, arch, win_path}] from sign-windows-binaries
    - name: windowsCredentials
      type: string
      description: Secret containing Windows host credentials
      default: windows-credentials
    - name: windowsSSHKey
      type: string
      description: Secret containing SSH private key for Windows host
      default: windows-ssh-key
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success if the task succeeds, the error otherwise
    - name: created_installers
      description: JSON array of created installers [{component, arch, win_path, installer_name}]
  volumes:
    - name: workdir
      emptyDir: {}
    - name: windows-credentials
      secret:
        secretName: $(params.windowsCredentials)
        defaultMode: 0444
    - name: windows-ssh-key
      secret:
        secretName: $(params.windowsSSHKey)
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true

  steps:
    - name: create-installer
      image: quay.io/konflux-ci/release-service-utils:82012e03002128f2a226acb23dc5c6fc1c37f5b6
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      volumeMounts:
        - name: workdir
          mountPath: /workdir
        - name: windows-credentials
          mountPath: /mnt/windows-credentials
        - name: windows-ssh-key
          mountPath: /mnt/windows-ssh-key
      env:
        - name: SIGNED_BINARIES
          value: "$(params.signed_binaries)"
      script: |
        #!/usr/bin/env bash
        set -e
        set -o pipefail

        # Load secrets
        WIN_HOST=$(cat /mnt/windows-credentials/host)
        WIN_USER=$(cat /mnt/windows-credentials/username)

        set -x

        STDERR_FILE=/tmp/stderr.txt

        exitfunc() {
            local err=$1
            local line=$2
            local command="$3"
            if [ "$err" -eq 0 ] ; then
                echo -n "Success" > "$(results.result.path)"
            else
                echo "$0: ERROR '$command' failed at line $line - exited with status $err" \
                  > "$(results.result.path)"
                if [ -f "$STDERR_FILE" ] ; then
                    grep -v "^\+" "$STDERR_FILE" | tail -c 512 | tee -a "$(results.result.path)"
                fi
            fi
            exit $err
        }
        trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

        # Setup SSH
        mkdir -p /tekton/home/.ssh
        cp /mnt/windows-ssh-key/windows_id_rsa /tekton/home/.ssh/id_rsa
        chmod 600 /tekton/home/.ssh/id_rsa
        
        SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        SSH_CMD="ssh $SSH_OPTS ${WIN_USER}@${WIN_HOST}"

        # Parse input array
        BINARY_COUNT=$(jq 'length' <<< "$SIGNED_BINARIES")
        echo "=== Creating installers for $BINARY_COUNT signed binary sets ==="

        # Initialize output array
        CREATED_INSTALLERS="[]"

        # Loop over each signed binary set
        for i in $(seq 0 $((BINARY_COUNT - 1))); do
            BINARY=$(jq -c ".[$i]" <<< "$SIGNED_BINARIES")
            WIN_PATH=$(jq -r '.win_path' <<< "$BINARY")
            WIN_ARCH=$(jq -r '.arch' <<< "$BINARY")
            COMPONENT_NAME=$(jq -r '.component' <<< "$BINARY")

            echo ""
            echo "=== [$((i+1))/$BINARY_COUNT] Creating installer for $COMPONENT_NAME ($WIN_ARCH) ==="
            echo "Win path: $WIN_PATH"

            # Step 1: Verify signed binaries exist
            echo "--- Step 1: Verify signed binaries ---"
            $SSH_CMD "
                if (-not (Test-Path '${WIN_PATH}\\win-unpacked')) {
                    Write-Error 'Signed win-unpacked not found at: ${WIN_PATH}\\win-unpacked'
                    exit 1
                }
                Write-Host 'Found signed binaries at: ${WIN_PATH}\\win-unpacked'
                Get-ChildItem '${WIN_PATH}\\win-unpacked' -Recurse -Include '*.exe' | Select-Object -First 5 Name
            " 2>"$STDERR_FILE"

            # Step 2: Check for nsis-config.json
            echo "--- Step 2: Check for nsis-config.json ---"
            HAS_NSIS_CONFIG=$($SSH_CMD "
                if (Test-Path '${WIN_PATH}\\nsis-config.json') {
                    Write-Output 'true'
                } else {
                    Write-Output 'false'
                }
            " | tr -d '\r\n')
            
            echo "Has nsis-config.json: $HAS_NSIS_CONFIG"

            # Step 3: Create NSIS installer with electron-builder
            echo "--- Step 3: Create NSIS installer ---"
            
            # Determine arch flag
            ARCH_FLAG="--x64"
            if [ "$WIN_ARCH" == "arm64" ]; then
                ARCH_FLAG="--arm64"
            fi

            # Build the electron-builder command
            # Node.js should be in PATH on Windows VM
            $SSH_CMD "
                Set-Location '${WIN_PATH}'
                
                # Check if package.json exists (required by electron-builder)
                if (-not (Test-Path 'package.json')) {
                    Write-Error 'package.json not found in ${WIN_PATH}'
                    exit 1
                }
                
                # Check for nsis-config.json
                \$configArg = ''
                if (Test-Path 'nsis-config.json') {
                    \$configArg = '--config nsis-config.json'
                    Write-Host 'Using nsis-config.json:'
                    Get-Content 'nsis-config.json'
                } else {
                    Write-Host 'WARNING: nsis-config.json not found, using defaults'
                }
                
                Write-Host ''
                Write-Host 'Running electron-builder...'
                
                # Run electron-builder
                # --prepackaged points to the signed win-unpacked directory
                # Disable code signing in electron-builder (we sign separately)
                \$cmd = \"npx electron-builder --win nsis $ARCH_FLAG --prepackaged win-unpacked \$configArg -c.win.signAndEditExecutable=false\"
                Write-Host \"Command: \$cmd\"
                Invoke-Expression \$cmd
                
                if (\$LASTEXITCODE -ne 0) {
                    Write-Error 'electron-builder failed'
                    exit 1
                }
                
                Write-Host ''
                Write-Host 'Installer created:'
                Get-ChildItem 'dist\\*.exe' | Format-Table Name, Length
            " 2>&1 | tee /tmp/builder_output.txt

            # Step 4: Get installer name
            echo "--- Step 4: Get installer path ---"
            INSTALLER_NAME=$($SSH_CMD "
                \$installer = Get-ChildItem '${WIN_PATH}\\dist\\*Setup*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
                if (-not \$installer) {
                    # Fallback: find any .exe in dist
                    \$installer = Get-ChildItem '${WIN_PATH}\\dist\\*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
                }
                if (\$installer) { 
                    Write-Output \$installer.Name 
                }
            " | tr -d '\r\n')

            if [ -z "$INSTALLER_NAME" ]; then
                echo "ERROR: No installer .exe found in dist directory"
                exit 1
            fi
            
            INSTALLER_PATH="${WIN_PATH}\\dist\\${INSTALLER_NAME}"
            
            echo "INSTALLER_NAME: $INSTALLER_NAME"
            echo "INSTALLER_PATH: $INSTALLER_PATH"

            # Add to output array
            CREATED_INSTALLERS=$(jq -c \
                --arg component "$COMPONENT_NAME" \
                --arg arch "$WIN_ARCH" \
                --arg win_path "$WIN_PATH" \
                --arg installer_name "$INSTALLER_NAME" \
                '. + [{component: $component, arch: $arch, win_path: $win_path, installer_name: $installer_name}]' \
                <<< "$CREATED_INSTALLERS")
        done

        echo ""
        echo "=== Create-windows-installer complete ==="
        echo "Created $BINARY_COUNT installers:"
        jq '.' <<< "$CREATED_INSTALLERS"

        # Write results
        echo -n "$CREATED_INSTALLERS" > "$(results.created_installers.path)"
