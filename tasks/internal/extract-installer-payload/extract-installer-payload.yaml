---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: extract-installer-payload
  annotations:
    tekton.dev/pipelines.minVersion: "0.1.0"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to inspect OCI artifacts and extract platform-specific metadata.
    
    This task:
    - Fetches OCI manifest for each component in the snapshot
    - Auto-discovers ALL platform-specific artifacts (macOS, Windows) by artifactType + OS
    - Returns metadata including pullspecs for ALL architectures found
    
    Does NOT extract or re-package content - signing VMs pull directly via oras.
  params:
    - name: snapshot_json
      type: string
      description: String containing a JSON representation of the snapshot spec
    - name: macArtifactType
      type: string
      description: OCI artifact type for macOS content
      default: "application/vnd.konflux.detached-signing.v1"
    - name: macPlatformOS
      type: string
      description: Platform OS for macOS artifacts
      default: "darwin"
    - name: winArtifactType
      type: string
      description: OCI artifact type for Windows content
      default: "application/vnd.konflux.detached-signing.v1"
    - name: winPlatformOS
      type: string
      description: Platform OS for Windows artifacts
      default: "windows"
    - name: caTrustConfigMapName
      type: string
      description: The name of the ConfigMap to read CA bundle data from
      default: trusted-ca
    - name: caTrustConfigMapKey
      type: string
      description: The name of the key in the ConfigMap that contains the CA bundle data
      default: ca-bundle.crt
  results:
    - name: result
      description: Success if the task succeeds, the error otherwise
    - name: has_mac_content
      description: true if macOS content was found, false otherwise
    - name: has_windows_content
      description: true if Windows content was found, false otherwise
    - name: components_metadata
      description: JSON array with per-component metadata (pullspecs for all arches)
    - name: mac_artifacts
      description: JSON array of all macOS artifacts [{arch, pullspec, component}]
    - name: win_artifacts
      description: JSON array of all Windows artifacts [{arch, pullspec, component}]
  volumes:
    - name: workdir
      emptyDir: {}
    - name: redhat-workloads-token
      secret:
        secretName: redhat-workloads-token
        defaultMode: 0444
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    securityContext:
      runAsUser: 1001
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true

  steps:
    - name: inspect-artifacts
      image: quay.io/konflux-ci/release-service-utils:82012e03002128f2a226acb23dc5c6fc1c37f5b6
      computeResources:
        limits:
          memory: 256Mi
        requests:
          memory: 256Mi
          cpu: 100m
      volumeMounts:
        - name: workdir
          mountPath: /workdir
        - name: redhat-workloads-token
          mountPath: /mnt/redhat-workloads-token
      env:
        - name: "SNAPSHOT_JSON"
          value: "$(params.snapshot_json)"
        - name: "MAC_ARTIFACT_TYPE"
          value: "$(params.macArtifactType)"
        - name: "MAC_PLATFORM_OS"
          value: "$(params.macPlatformOS)"
        - name: "WIN_ARTIFACT_TYPE"
          value: "$(params.winArtifactType)"
        - name: "WIN_PLATFORM_OS"
          value: "$(params.winPlatformOS)"
      script: |
        #!/usr/bin/env bash
        set -e

        DOCKER_CONFIG_JSON="$(cat /mnt/redhat-workloads-token/.dockerconfigjson)"

        set -x

        STDERR_FILE=/tmp/stderr.txt

        exitfunc() {
            local err=$1
            local line=$2
            local command="$3"
            if [ "$err" -eq 0 ] ; then
                echo -n "Success" > "$(results.result.path)"
            else
                echo "$0: ERROR '$command' failed at line $line - exited with status $err" \
                  > "$(results.result.path)"
                if [ -f "$STDERR_FILE" ] ; then
                    grep -v "^\+" "$STDERR_FILE" | tail -c 512 | tee -a "$(results.result.path)"
                fi
            fi
            exit 0
        }
        trap 'exitfunc $? $LINENO "$BASH_COMMAND"' EXIT

        mkdir -p ~/.docker
        set +x
        echo "$DOCKER_CONFIG_JSON" | sed -r 's/(^|\})[^{}]+(\{|$)/\1\2/g' > ~/.docker/config.json
        set -x

        # Initialize platform detection flags
        HAS_MAC="false"
        HAS_WINDOWS="false"

        # Initialize components metadata array and global artifact arrays
        COMPONENTS_METADATA="[]"
        ALL_MAC_ARTIFACTS="[]"
        ALL_WIN_ARTIFACTS="[]"

        NUM_COMPONENTS=$(jq '.components | length' <<< "$SNAPSHOT_JSON")

        for ((i = 0; i < NUM_COMPONENTS; i++)) ; do
            COMPONENT=$(jq -c --arg i "$i" '.components[$i|tonumber]' <<< "$SNAPSHOT_JSON")
            
            COMPONENT_NAME=$(jq -er '.name' <<< "${COMPONENT}") \
                  || (echo "Component $((i + 1)) is missing 'name'" >&2 && exit 1 )
            PULLSPEC=$(jq -er '.containerImage' <<< "${COMPONENT}") \
                  || (echo "Component ${COMPONENT_NAME} is missing 'containerImage'" >&2 && exit 1 )
            
            echo "Processing component: $COMPONENT_NAME"
            echo "Base pullspec: $PULLSPEC"
            
            # Extract registry and tag/digest from pullspec
            # Format: registry/repo:tag or registry/repo@sha256:digest
            if [[ "$PULLSPEC" == *"@"* ]]; then
                # Already has digest, extract registry/repo
                OCI_BASE="${PULLSPEC%@*}"
                OCI_REF="$PULLSPEC"
            else
                # Has tag
                OCI_BASE="${PULLSPEC%:*}"
                OCI_TAG="${PULLSPEC##*:}"
                OCI_REF="$PULLSPEC"
            fi
            
            echo "Fetching manifest from: $OCI_REF"
            
            # Fetch the manifest index
            AUTH_FILE=$(mktemp)
            select-oci-auth "${PULLSPEC}" > "$AUTH_FILE"
            
            MANIFEST=$(skopeo inspect --authfile "$AUTH_FILE" --raw "docker://$OCI_REF" 2>"$STDERR_FILE") || {
                echo "Warning: Could not fetch manifest for $COMPONENT_NAME"
                continue
            }
            
            # Check if this is a manifest list/index
            MEDIA_TYPE=$(jq -r '.mediaType // .schemaVersion' <<< "$MANIFEST")
            echo "Manifest media type: $MEDIA_TYPE"
            
            # Initialize per-component artifact arrays
            MAC_ARTIFACTS="[]"
            WIN_ARTIFACTS="[]"
            
            if [[ "$MEDIA_TYPE" == *"manifest.list"* ]] || [[ "$MEDIA_TYPE" == *"image.index"* ]]; then
                # Multi-platform manifest - auto-discover ALL platform-specific artifacts
                echo "Multi-platform manifest detected - auto-discovering all platforms..."
                
                # Find ALL macOS artifacts (any architecture)
                MAC_ARTIFACTS=$(jq -c --arg type "$MAC_ARTIFACT_TYPE" --arg os "$MAC_PLATFORM_OS" --arg base "$OCI_BASE" \
                    '[.manifests[] | select(
                        (.artifactType == $type or .annotations["org.opencontainers.image.type"] == $type) and 
                        .platform.os == $os
                    ) | {
                        arch: .platform.architecture,
                        pullspec: ($base + "@" + .digest)
                    }]' <<< "$MANIFEST")
                
                # Find ALL Windows artifacts (any architecture)
                WIN_ARTIFACTS=$(jq -c --arg type "$WIN_ARTIFACT_TYPE" --arg os "$WIN_PLATFORM_OS" --arg base "$OCI_BASE" \
                    '[.manifests[] | select(
                        (.artifactType == $type or .annotations["org.opencontainers.image.type"] == $type) and 
                        .platform.os == $os
                    ) | {
                        arch: .platform.architecture,
                        pullspec: ($base + "@" + .digest)
                    }]' <<< "$MANIFEST")
                
                # Check if any macOS artifacts found
                MAC_COUNT=$(jq 'length' <<< "$MAC_ARTIFACTS")
                if [ "$MAC_COUNT" -gt 0 ]; then
                    HAS_MAC="true"
                    echo "Found $MAC_COUNT macOS artifact(s):"
                    jq -r '.[] | "  - \(.arch): \(.pullspec)"' <<< "$MAC_ARTIFACTS"
                    # Add to global array with component name
                    ALL_MAC_ARTIFACTS=$(jq --arg name "$COMPONENT_NAME" --argjson artifacts "$MAC_ARTIFACTS" \
                        '. + [$artifacts[] | . + {component: $name}]' <<< "$ALL_MAC_ARTIFACTS")
                fi
                
                # Check if any Windows artifacts found
                WIN_COUNT=$(jq 'length' <<< "$WIN_ARTIFACTS")
                if [ "$WIN_COUNT" -gt 0 ]; then
                    HAS_WINDOWS="true"
                    echo "Found $WIN_COUNT Windows artifact(s):"
                    jq -r '.[] | "  - \(.arch): \(.pullspec)"' <<< "$WIN_ARTIFACTS"
                    # Add to global array with component name
                    ALL_WIN_ARTIFACTS=$(jq --arg name "$COMPONENT_NAME" --argjson artifacts "$WIN_ARTIFACTS" \
                        '. + [$artifacts[] | . + {component: $name}]' <<< "$ALL_WIN_ARTIFACTS")
                fi
            else
                # Single platform manifest - check content
                echo "Single platform manifest, checking for platform indicators..."
                
                # Try to determine platform from labels or file patterns
                # This is a fallback for non-multi-platform images
                LABELS=$(jq -r '.config.Labels // {}' <<< "$MANIFEST" 2>/dev/null || echo "{}")
                
                # For single manifest, assume it's usable and let signing task determine platform
                echo "Single manifest - will be used by signing tasks to determine platform content"
            fi
            
            # Add component metadata to array (now with artifact arrays)
            COMPONENT_META=$(jq -n \
                --arg name "$COMPONENT_NAME" \
                --arg pullspec "$PULLSPEC" \
                --argjson mac_artifacts "$MAC_ARTIFACTS" \
                --argjson win_artifacts "$WIN_ARTIFACTS" \
                '{
                    name: $name,
                    pullspec: $pullspec,
                    mac_artifacts: $mac_artifacts,
                    win_artifacts: $win_artifacts
                }')
            
            COMPONENTS_METADATA=$(jq --argjson meta "$COMPONENT_META" '. + [$meta]' <<< "$COMPONENTS_METADATA")
            
            rm -f "$AUTH_FILE"
        done

        echo ""
        echo "=== Summary ==="
        echo "Has macOS content: $HAS_MAC"
        echo "Has Windows content: $HAS_WINDOWS"
        
        MAC_TOTAL=$(jq 'length' <<< "$ALL_MAC_ARTIFACTS")
        WIN_TOTAL=$(jq 'length' <<< "$ALL_WIN_ARTIFACTS")
        echo "Total macOS artifacts: $MAC_TOTAL"
        echo "Total Windows artifacts: $WIN_TOTAL"
        
        echo ""
        echo "All macOS artifacts:"
        jq '.' <<< "$ALL_MAC_ARTIFACTS"
        
        echo ""
        echo "All Windows artifacts:"
        jq '.' <<< "$ALL_WIN_ARTIFACTS"
        
        echo ""
        echo "Components metadata:"
        echo "$COMPONENTS_METADATA" | jq '.'

        # Write results
        echo -n "$HAS_MAC" > "$(results.has_mac_content.path)"
        echo -n "$HAS_WINDOWS" > "$(results.has_windows_content.path)"
        echo -n "$COMPONENTS_METADATA" > "$(results.components_metadata.path)"
        echo -n "$ALL_MAC_ARTIFACTS" > "$(results.mac_artifacts.path)"
        echo -n "$ALL_WIN_ARTIFACTS" > "$(results.win_artifacts.path)"

        echo ""
        echo "Inspection complete. Use mac_artifacts/win_artifacts arrays for signing tasks."
        echo "Component name available in each artifact object as 'component' field."
