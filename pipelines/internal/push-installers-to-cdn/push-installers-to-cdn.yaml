---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: push-installers-to-cdn
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton Pipeline to sign .app/.exe files, create installers, sign installers, and push installers (macOS, Windows) to CDN and Developer Portal.
    
    This pipeline:
    1. Inspects OCI artifacts to find platform-specific content
    2. Signs Mac .app, creates DMG, notarizes (3 tasks, Mac VM pulls directly via oras)
    3. Signs Windows binaries, creates installer, signs installer (3 tasks, Windows VM pulls directly via oras)
    4. Generates GPG-signed checksums
    5. Pushes artifacts to Exodus CDN, Pulp, and Content Gateway
  params:
    - name: snapshot_json
      type: string
      description: String containing a JSON representation of the snapshot spec
    - name: exodusGwSecret
      type: string
      description: Env specific secret containing the Exodus Gateway configs
    - name: exodusGwEnv
      type: string
      description: Environment to use in the Exodus Gateway. Options are [live, pre]
    - name: pulpSecret
      type: string
      description: Env specific secret containing the rhsm-pulp credentials
    - name: udcacheSecret
      type: string
      description: Env specific secret containing the udcache credentials
    - name: cgwHostname
      type: string
      description: The hostname of the content-gateway to publish the metadata to
      default: https://developers.redhat.com/content-gateway/rest/admin
    - name: cgwSecret
      type: string
      description: Env specific secret containing the content gateway credentials
    - name: author
      type: string
      description: Author taken from Release to be used for checksum signing
    - name: signingKeyName
      type: string
      description: Signing key name to be used for checksum signing
    - name: taskGitUrl
      description: The url to the git repo where the release-service-catalog tasks to be used are stored
      default: https://github.com/konflux-ci/release-service-catalog.git
      type: string
    - name: taskGitRevision
      description: The revision in the taskGitUrl repo to be used
      type: string
    - name: quayURL
      description: Quay URL of the repo where content will be shared between tasks
      type: string
      default: "quay.io/konflux-artifacts"
    # Mac host params
    - name: macHostCredentials
      type: string
      description: Secret containing Mac host username and host
      default: mac-host-credentials
    - name: macSigningCredentials
      type: string
      description: Secret containing Mac signing credentials (keychain, Apple ID, etc.)
      default: mac-signing-credentials
    - name: macSSHKey
      type: string
      description: Secret containing SSH private key for Mac host
      default: mac-ssh-key
    # Windows host params
    - name: windowsCredentials
      type: string
      description: Secret to interact with the Windows signing host
      default: windows-credentials
    - name: windowsSSHKey
      type: string
      description: Secret containing SSH private key for the Windows signing host
      default: windows-ssh-key
  workspaces:
    - name: data
      description: Workspace for sharing data between tasks
  results:
    - name: result
      value: $(tasks.push-to-cdn.results.result)
  tasks:
    - name: extract-installer-payload
      timeout: "30m0s"
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/extract-installer-payload/extract-installer-payload.yaml
      params:
        - name: snapshot_json
          value: $(params.snapshot_json)
    # =========================================================================
    # Mac Signing (3 tasks)
    #   - Sign .app
    #   - Create DMG from signed .app
    #   - Sign, notarize, staple signed DMG
    # =========================================================================
    - name: sign-mac-app
      timeout: "1h00m0s"
      when:
        - input: $(tasks.extract-installer-payload.results.has_mac_content)
          operator: in
          values: ["true"]
      runAfter:
        - extract-installer-payload
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/sign-mac-app/sign-mac-app.yaml
      params:
        - name: mac_pullspec
          value: $(tasks.extract-installer-payload.results.mac_pullspec)
        - name: component_name
          value: $(tasks.extract-installer-payload.results.component_name)
        - name: macHostCredentials
          value: $(params.macHostCredentials)
        - name: macSigningCredentials
          value: $(params.macSigningCredentials)
        - name: macSSHKey
          value: $(params.macSSHKey)
        - name: quaySecret
          value: quay-credentials
    - name: create-mac-dmg
      timeout: "30m0s"
      when:
        - input: $(tasks.extract-installer-payload.results.has_mac_content)
          operator: in
          values: ["true"]
      runAfter:
        - sign-mac-app
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/create-mac-dmg/create-mac-dmg.yaml
      params:
        - name: signed_app_path
          value: $(tasks.sign-mac-app.results.signed_app_path)
        - name: component_name
          value: $(tasks.extract-installer-payload.results.component_name)
        - name: macHostCredentials
          value: $(params.macHostCredentials)
        - name: macSSHKey
          value: $(params.macSSHKey)
    - name: sign-mac-dmg
      timeout: "2h00m0s"
      when:
        - input: $(tasks.extract-installer-payload.results.has_mac_content)
          operator: in
          values: ["true"]
      runAfter:
        - create-mac-dmg
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/sign-mac-dmg/sign-mac-dmg.yaml
      params:
        - name: dmg_path
          value: $(tasks.create-mac-dmg.results.dmg_path)
        - name: component_name
          value: $(tasks.extract-installer-payload.results.component_name)
        - name: quayURL
          value: $(params.quayURL)
        - name: quaySecret
          value: quay-credentials
        - name: macHostCredentials
          value: $(params.macHostCredentials)
        - name: macSigningCredentials
          value: $(params.macSigningCredentials)
        - name: macSSHKey
          value: $(params.macSSHKey)
    # =========================================================================
    # Windows Signing (3 tasks)
    #   - Sign binaries (.exe, .dll, .node)
    #   - Create NSIS installer from signed binaries
    #   - Sign the installer
    # =========================================================================
    - name: sign-windows-binaries
      timeout: "1h00m0s"
      when:
        - input: $(tasks.extract-installer-payload.results.has_windows_content)
          operator: in
          values: ["true"]
      runAfter:
        - extract-installer-payload
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/sign-windows-binaries/sign-windows-binaries.yaml
      params:
        - name: win_pullspec
          value: $(tasks.extract-installer-payload.results.win_pullspec)
        - name: component_name
          value: $(tasks.extract-installer-payload.results.component_name)
        - name: windowsCredentials
          value: $(params.windowsCredentials)
        - name: windowsSSHKey
          value: $(params.windowsSSHKey)
        - name: quaySecret
          value: quay-credentials
    - name: create-windows-installer
      timeout: "30m0s"
      when:
        - input: $(tasks.extract-installer-payload.results.has_windows_content)
          operator: in
          values: ["true"]
      runAfter:
        - sign-windows-binaries
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/create-windows-installer/create-windows-installer.yaml
      params:
        - name: win_unpacked_path
          value: $(tasks.sign-windows-binaries.results.win_unpacked_path)
        - name: component_name
          value: $(tasks.extract-installer-payload.results.component_name)
        - name: windowsCredentials
          value: $(params.windowsCredentials)
        - name: windowsSSHKey
          value: $(params.windowsSSHKey)
    - name: sign-windows-installer
      timeout: "30m0s"
      when:
        - input: $(tasks.extract-installer-payload.results.has_windows_content)
          operator: in
          values: ["true"]
      runAfter:
        - create-windows-installer
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/sign-windows-installer/sign-windows-installer.yaml
      params:
        - name: installer_path
          value: $(tasks.create-windows-installer.results.installer_path)
        - name: component_name
          value: $(tasks.extract-installer-payload.results.component_name)
        - name: quayURL
          value: $(params.quayURL)
        - name: quaySecret
          value: quay-credentials
        - name: windowsCredentials
          value: $(params.windowsCredentials)
        - name: windowsSSHKey
          value: $(params.windowsSSHKey)
    - name: generate-checksums
      timeout: "30m0s"
      runAfter:
        - extract-installer-payload
        # These runAfter ensure we wait for signing tasks if they run
        # If they're skipped (when=false), this task still runs
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/generate-checksums/generate-checksums.yaml
      params:
        # These will be empty strings if the signing tasks were skipped
        - name: signed_mac_dmg_pullspec
          value: $(tasks.sign-mac-dmg.results.signed_dmg_pullspec)
        - name: signed_windows_installer_pullspec
          value: $(tasks.sign-windows-installer.results.signed_installer_pullspec)
        - name: component_name
          value: $(tasks.extract-installer-payload.results.component_name)
        - name: author
          value: $(params.author)
        - name: signingKeyName
          value: $(params.signingKeyName)
      workspaces:
        - name: data
          workspace: data
    - name: push-to-cdn
      timeout: "4h00m0s"
      runAfter:
        - generate-checksums
      taskRef:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: tasks/internal/push-to-cdn/push-to-cdn.yaml
      params:
        - name: snapshot_json
          value: $(params.snapshot_json)
        - name: exodusGwSecret
          value: $(params.exodusGwSecret)
        - name: exodusGwEnv
          value: $(params.exodusGwEnv)
        - name: pulpSecret
          value: $(params.pulpSecret)
        - name: udcacheSecret
          value: $(params.udcacheSecret)
        - name: cgwHostname
          value: $(params.cgwHostname)
        - name: cgwSecret
          value: $(params.cgwSecret)
      workspaces:
        - name: data
          workspace: data
